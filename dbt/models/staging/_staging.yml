version: 2

models:
  - name: stg_trips
    description: >
      One row per HVFHV trip, renamed/typed from the raw source. No
      business logic applied at this layer.
    columns:
      - name: hvfhs_license_num
        description: "TLC license code for the dispatching company."
        tests:
          - not_null
          - accepted_values:
              # all 4 officially issued HVFHS codes, not just the 2 that
              # happen to appear in the current month's data -- this
              # should stay valid if more months (or reintroduced
              # companies) get loaded later
              values: ['HV0002', 'HV0003', 'HV0004', 'HV0005']

      - name: pickup_datetime
        tests:
          - not_null

      - name: dropoff_datetime
        tests:
          - not_null

      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              # codifies the check done by hand in sql/exploration/05 --
              # every pickup zone must exist in the zone lookup
              to: ref('stg_zones')
              field: location_id

      - name: dropoff_location_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_zones')
              field: location_id

      - name: shared_request_flag
        description: "Did the rider request a shared/pooled ride? Y/N, not boolean."
        tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: shared_match_flag
        description: "Was the rider actually matched with another rider? Y/N, not boolean."
        tests:
          - accepted_values:
              values: ['Y', 'N']

  - name: stg_zones
    description: "NYC TLC taxi zone lookup, renamed from the raw source."
    columns:
      - name: location_id
        tests:
          - not_null
          - unique

  # -- delivery vertical (Instacart Market Basket) --

  - name: stg_orders
    description: "One row per order, all 206,209 users, all eval_set values."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - not_null
      - name: eval_set
        tests:
          - accepted_values:
              values: ['prior', 'train', 'test']
      - name: order_number
        tests:
          - not_null

  - name: stg_order_products_prior
    description: >
      Product-level detail for eval_set='prior' orders -- the safe,
      symmetric source for volume/monetary-proxy metrics (see
      CLAUDE.md's eval_set gotcha).
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - product_id

  - name: stg_order_products_train
    description: "Product-level detail for eval_set='train' orders only (131,209 of 206,209 users)."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - product_id

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: aisle_id
        tests:
          - relationships:
              to: ref('stg_aisles')
              field: aisle_id
      - name: department_id
        tests:
          - relationships:
              to: ref('stg_departments')
              field: department_id

  - name: stg_aisles
    columns:
      - name: aisle_id
        tests:
          - not_null
          - unique

  - name: stg_departments
    columns:
      - name: department_id
        tests:
          - not_null
          - unique
