version: 2

models:
  - name: int_trips_enriched
    description: >
      One row per trip (same grain as stg_trips), enriched with company
      label, zone names, date/time buckets, and the three derived
      timestamp intervals. The reusable building block every mart and
      future question should select from instead of re-deriving these.
    columns:
      - name: provider_name
        tests:
          - not_null
          - accepted_values:
              values: ['Uber', 'Lyft']

      - name: pickup_zone
        tests:
          - not_null

      - name: dropoff_zone
        tests:
          - not_null

      - name: day_type
        tests:
          - accepted_values:
              values: ['weekday', 'weekend']

      - name: hour_of_day
        tests:
          - not_null

  - name: int_order_products_enriched
    description: >
      Item-level detail across order_products_prior + order_products_train
      combined, joined to product/aisle/department names and order
      context. The reusable building block every delivery-vertical mart
      needing product-level detail should select from.
    columns:
      - name: source_eval_set
        tests:
          - accepted_values:
              values: ['prior', 'train']
      - name: product_name
        tests:
          - not_null
      - name: department
        tests:
          - not_null
